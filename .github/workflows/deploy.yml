name: Deploy a GitHub Pages

on:
  # Cada push a main republica el sitio.
  push:
    branches: [main]
  # Y se puede disparar a mano desde la pestaña Actions.
  workflow_dispatch:

# Permisos que necesita el deploy oficial de Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy a la vez. Si se acumulan pushes se descartan los intermedios,
# pero nunca se corta uno en curso: cancelar a mitad de la publicacion puede
# dejar el sitio servido a medias.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Traer el codigo
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Construir
        env:
          # Definilas en Settings > Secrets and variables > Actions > Variables.
          # Si no existen, el sitio usa los valores por defecto y el formulario
          # queda en modo demo (valida pero no envia).
          BASE_PATH: ${{ vars.BASE_PATH || '/argos/' }}
          VITE_LEADS_ENDPOINT: ${{ vars.VITE_LEADS_ENDPOINT }}
          VITE_WHATSAPP: ${{ vars.VITE_WHATSAPP }}
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}
        run: npm run build

      - name: Subir el sitio como artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en Pages
        id: deployment
        uses: actions/deploy-pages@v4
